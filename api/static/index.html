<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DepGuard Agent — 多智能体协作分析</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0e1015;
    --bg-sidebar: #14171f;
    --bg-panel: #1a1e27;
    --bg-hover: #232834;
    --border: #262b36;
    --border-soft: #1f2430;
    --text: #e6e8ef;
    --text-dim: #8b93a7;
    --text-faint: #5b6270;
    --accent: #4d6bfe;
    --accent-soft: rgba(77,107,254,.14);
    --accent-hover: #3f5ce0;
    --green: #31c48d;
    --green-bg: rgba(49,196,141,.13);
    --blue: #4d9fff;
    --blue-bg: rgba(77,159,255,.13);
    --orange: #f5a623;
    --orange-bg: rgba(245,166,35,.13);
    --purple: #a78bfa;
    --purple-bg: rgba(167,139,250,.13);
    --red: #f25f5c;
    --red-bg: rgba(242,95,92,.13);
    --radius: 12px;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
  }

  body {
    font-family: var(--font); background: var(--bg); color: var(--text);
    height: 100vh; display: flex; overflow: hidden; font-size: 14px;
  }

  /* ─────────── 侧边栏 ─────────── */
  .sidebar {
    width: 272px; flex-shrink: 0; background: var(--bg-sidebar);
    border-right: 1px solid var(--border); display: flex; flex-direction: column;
    transition: margin-left .2s ease;
  }
  .sidebar.collapsed { margin-left: -272px; }
  .sidebar-head { padding: 16px 16px 12px; }
  .logo { display: flex; align-items: center; gap: 9px; font-size: 16px; font-weight: 700; letter-spacing: -.3px; }
  .logo .mark {
    width: 26px; height: 26px; border-radius: 7px; flex-shrink: 0;
    background: linear-gradient(135deg, #4d6bfe, #7c5cff);
    display: flex; align-items: center; justify-content: center; font-size: 14px; color: #fff;
  }
  .logo .sub { display: block; font-size: 11px; color: var(--text-faint); font-weight: 400; margin-top: 1px; }

  .new-chat-btn {
    width: 100%; margin-top: 14px; padding: 10px 14px; font-size: 13px; font-weight: 600;
    font-family: var(--font); color: var(--text); background: var(--bg-panel);
    border: 1px solid var(--border); border-radius: 9px; cursor: pointer;
    display: flex; align-items: center; gap: 8px; transition: all .15s;
  }
  .new-chat-btn:hover { background: var(--bg-hover); border-color: #333a49; }

  .sidebar-section { padding: 8px 10px; overflow-y: auto; }
  .sidebar-section-title {
    font-size: 11px; color: var(--text-faint); text-transform: uppercase;
    letter-spacing: .8px; padding: 8px 8px 6px; font-weight: 600;
    display: flex; align-items: center; justify-content: space-between;
  }
  .conv-list { flex: 1; }
  .conv-item {
    display: flex; align-items: center; gap: 9px; padding: 9px 10px; border-radius: 8px;
    cursor: pointer; color: var(--text-dim); transition: background .12s; user-select: none;
  }
  .conv-item:hover { background: var(--bg-hover); color: var(--text); }
  .conv-item.active { background: var(--bg-hover); color: var(--text); }
  .conv-title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }
  .conv-status { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .conv-status.running { background: var(--accent); animation: pulse 1.2s infinite; }
  .conv-status.done { background: var(--green); }
  .conv-status.error { background: var(--red); }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
  .conv-del { opacity: 0; color: var(--text-faint); font-size: 15px; padding: 0 2px; transition: opacity .12s; }
  .conv-item:hover .conv-del { opacity: 1; }
  .conv-del:hover { color: var(--red); }

  /* 文件区 */
  .file-section { max-height: 40%; border-top: 1px solid var(--border-soft); display: flex; flex-direction: column; }
  .file-list { overflow-y: auto; padding: 0 6px 6px; }
  .file-item {
    display: flex; align-items: center; gap: 8px; padding: 7px 8px; border-radius: 7px;
    font-size: 12px; transition: background .12s;
  }
  .file-item:hover { background: var(--bg-hover); }
  .file-icon { font-size: 15px; flex-shrink: 0; }
  .file-name { flex: 1; min-width: 0; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .file-meta { font-size: 10px; color: var(--text-faint); }
  .file-dl { color: var(--text-faint); cursor: pointer; font-size: 13px; padding: 2px 4px; border-radius: 4px; }
  .file-dl:hover { color: var(--accent); background: var(--accent-soft); }

  .sidebar-foot {
    padding: 12px 16px; border-top: 1px solid var(--border-soft); display: flex;
    align-items: center; gap: 9px; font-size: 12px; color: var(--text-dim);
  }
  .avatar {
    width: 26px; height: 26px; border-radius: 50%; flex-shrink: 0;
    background: linear-gradient(135deg, #4d6bfe, #22c1c3);
    display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 12px; color: #fff;
  }
  .sidebar-foot .uid { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sidebar-foot button { background: none; border: 1px solid var(--border); color: var(--text-dim); font-size: 11px; padding: 3px 8px; border-radius: 5px; cursor: pointer; }
  .sidebar-foot button:hover { color: var(--text); border-color: #333a49; }

  /* ─────────── 主区域 ─────────── */
  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .topbar {
    display: flex; align-items: center; gap: 10px; padding: 11px 18px;
    border-bottom: 1px solid var(--border); flex-shrink: 0;
  }
  .toggle-side {
    background: none; border: none; color: var(--text-dim); cursor: pointer; font-size: 18px;
    padding: 4px 6px; border-radius: 6px; line-height: 1;
  }
  .toggle-side:hover { color: var(--text); background: var(--bg-hover); }
  .topbar-title { font-size: 14px; font-weight: 600; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .topbar-title .dim { color: var(--text-faint); font-weight: 400; }
  .conn-badge {
    display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-dim);
    padding: 4px 11px; border-radius: 20px; border: 1px solid var(--border);
  }
  .conn-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text-faint); }
  .conn-dot.on { background: var(--green); }
  .conn-dot.off { background: var(--red); }

  /* 聊天区 */
  .chat-scroll { flex: 1; overflow-y: auto; }
  .chat-inner { max-width: 760px; margin: 0 auto; padding: 26px 20px 40px; }

  .empty-state {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    height: 100%; color: var(--text-dim); text-align: center; gap: 14px; padding: 0 20px;
  }
  .empty-state .logo-big {
    width: 58px; height: 58px; border-radius: 16px; font-size: 28px;
    background: linear-gradient(135deg, #4d6bfe, #7c5cff);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 10px 34px rgba(77,107,254,.35);
  }
  .empty-state h2 { color: var(--text); font-size: 20px; font-weight: 700; }
  .empty-state p { font-size: 13px; max-width: 420px; line-height: 1.6; }
  .suggestions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 6px; }
  .suggestion {
    padding: 8px 14px; font-size: 12px; border-radius: 20px; cursor: pointer;
    border: 1px solid var(--border); color: var(--text-dim); background: var(--bg-panel); transition: all .15s;
  }
  .suggestion:hover { color: var(--text); border-color: var(--accent); background: var(--accent-soft); }

  /* 消息 */
  .msg { margin-bottom: 26px; animation: fadeIn .25s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  .msg-user { display: flex; justify-content: flex-end; }
  .bubble-user {
    max-width: 78%; padding: 11px 16px; border-radius: 16px 16px 4px 16px;
    background: var(--accent); color: #fff; line-height: 1.6; word-break: break-word; white-space: pre-wrap;
  }
  .msg-assistant { display: flex; gap: 12px; }
  .msg-avatar {
    width: 30px; height: 30px; border-radius: 9px; flex-shrink: 0;
    background: linear-gradient(135deg, #4d6bfe, #7c5cff);
    display: flex; align-items: center; justify-content: center; font-size: 15px;
  }
  .msg-content { flex: 1; min-width: 0; }
  .msg-name { font-size: 13px; font-weight: 600; margin-bottom: 6px; }
  .msg-name .time { color: var(--text-faint); font-weight: 400; font-size: 11px; margin-left: 8px; }

  /* 思考步骤 */
  .steps { margin-bottom: 10px; border: 1px solid var(--border-soft); border-radius: 9px; background: var(--bg-sidebar); overflow: hidden; }
  .steps-head {
    display: flex; align-items: center; gap: 8px; padding: 9px 12px; cursor: pointer;
    font-size: 12px; color: var(--text-dim); user-select: none;
  }
  .steps-head .spinner {
    width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--border);
    border-top-color: var(--accent); animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .steps-head .chevron { margin-left: auto; transition: transform .2s; font-size: 11px; }
  .steps.open .steps-head .chevron { transform: rotate(180deg); }
  .steps-body { display: none; padding: 2px 12px 10px; font-size: 12px; }
  .steps.open .steps-body { display: block; }
  .step { display: flex; gap: 8px; padding: 5px 0; color: var(--text-dim); align-items: baseline; }
  .step .s-icon { flex-shrink: 0; width: 16px; text-align: center; }
  .step .s-label { flex-shrink: 0; font-weight: 600; color: var(--text-dim); }
  .step .s-detail { color: var(--text-faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* 回答正文 */
  .answer { line-height: 1.75; font-size: 14px; color: var(--text); word-break: break-word; }
  .answer p { margin: 0 0 10px; }
  .answer h1,.answer h2,.answer h3,.answer h4 { margin: 18px 0 8px; font-weight: 700; line-height: 1.3; }
  .answer h1 { font-size: 20px; } .answer h2 { font-size: 17px; } .answer h3 { font-size: 15px; }
  .answer ul,.answer ol { margin: 0 0 10px 22px; }
  .answer li { margin: 3px 0; }
  .answer code { background: var(--bg-panel); border: 1px solid var(--border); border-radius: 4px; padding: 1px 5px; font-size: 12.5px; font-family: "SF Mono", Consolas, monospace; }
  .answer pre { background: #0b0d12; border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; overflow-x: auto; margin: 0 0 12px; }
  .answer pre code { background: none; border: none; padding: 0; font-size: 12.5px; line-height: 1.6; display: block; }
  .answer blockquote { border-left: 3px solid var(--accent); padding: 4px 14px; margin: 0 0 10px; color: var(--text-dim); }
  .answer a { color: var(--accent); }
  .answer table { border-collapse: collapse; margin: 0 0 12px; width: 100%; font-size: 13px; }
  .answer th,.answer td { border: 1px solid var(--border); padding: 6px 10px; text-align: left; }
  .answer th { background: var(--bg-panel); }
  .answer hr { border: none; border-top: 1px solid var(--border); margin: 16px 0; }
  .msg-error .answer { color: var(--red); }

  /* 输入区 */
  .input-wrap { padding: 10px 20px 18px; flex-shrink: 0; }
  .input-box {
    max-width: 760px; margin: 0 auto; background: var(--bg-panel);
    border: 1px solid var(--border); border-radius: 16px; padding: 10px 12px;
    transition: border-color .2s, box-shadow .2s;
  }
  .input-box:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .attach-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
  .attach-chip {
    display: inline-flex; align-items: center; gap: 5px; font-size: 12px;
    padding: 4px 9px; border-radius: 6px; background: var(--bg-hover); color: var(--text-dim);
  }
  .attach-chip .rm { cursor: pointer; color: var(--text-faint); }
  .attach-chip .rm:hover { color: var(--red); }
  .input-row { display: flex; align-items: flex-end; gap: 8px; }
  textarea {
    flex: 1; resize: none; border: none; background: none; color: var(--text);
    font-family: var(--font); font-size: 14px; line-height: 1.6; outline: none;
    max-height: 180px; padding: 4px 2px;
  }
  textarea::placeholder { color: var(--text-faint); }
  .icon-btn {
    background: none; border: none; color: var(--text-dim); cursor: pointer; font-size: 18px;
    width: 34px; height: 34px; border-radius: 8px; display: flex; align-items: center; justify-content: center; transition: all .12s;
  }
  .icon-btn:hover { background: var(--bg-hover); color: var(--text); }
  .send-btn {
    width: 34px; height: 34px; border: none; border-radius: 9px; cursor: pointer;
    background: var(--accent); color: #fff; font-size: 15px; display: flex; align-items: center; justify-content: center;
    transition: all .15s; flex-shrink: 0;
  }
  .send-btn:hover { background: var(--accent-hover); }
  .send-btn:disabled { background: var(--bg-hover); color: var(--text-faint); cursor: not-allowed; }
  .input-hint { text-align: center; font-size: 11px; color: var(--text-faint); margin-top: 8px; }

  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }
  ::-webkit-scrollbar-thumb:hover { background: #333a49; }
</style>
</head>
<body>

<!-- ═══ 侧边栏 ═══ -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar-head">
    <div class="logo">
      <div class="mark">🛡</div>
      <div>DepGuard Agent<span class="sub">多智能体协作分析</span></div>
    </div>
    <button class="new-chat-btn" onclick="newChat()">＋ 新建对话</button>
  </div>

  <div class="sidebar-section conv-list">
    <div class="sidebar-section-title">对话</div>
    <div id="convList"></div>
  </div>

  <div class="sidebar-section file-section">
    <div class="sidebar-section-title">
      <span>生成文件</span>
      <button class="icon-btn" style="width:24px;height:24px;font-size:14px;" onclick="refreshFiles()" title="刷新">↻</button>
    </div>
    <div class="file-list" id="fileList"></div>
  </div>

  <div class="sidebar-foot">
    <div class="avatar" id="avatar">?</div>
    <div class="uid" id="uid">未登录</div>
    <button onclick="reLogin()">切换用户</button>
  </div>
</aside>

<!-- ═══ 主区域 ═══ -->
<div class="main">
  <div class="topbar">
    <button class="toggle-side" onclick="toggleSidebar()" title="收起侧栏">☰</button>
    <div class="topbar-title" id="topbarTitle"><span class="dim">新建对话</span></div>
    <div class="conn-badge"><div class="conn-dot" id="connDot"></div><span id="connText">就绪</span></div>
  </div>

  <div class="chat-scroll" id="chatScroll">
    <div class="chat-inner" id="chatInner"></div>
  </div>

  <div class="input-wrap">
    <div class="input-box">
      <div class="attach-chips" id="attachChips"></div>
      <div class="input-row">
        <button class="icon-btn" onclick="document.getElementById('fileInput').click()" title="上传文件">📎</button>
        <textarea id="input" rows="1" placeholder="输入你的问题…（Shift+Enter 换行）"></textarea>
        <button class="send-btn" id="sendBtn" onclick="sendMessage()" title="发送">➤</button>
      </div>
      <input type="file" id="fileInput" multiple style="display:none" onchange="onFilesSelected(this.files)">
    </div>
    <div class="input-hint">支持依赖解析 / 漏洞情报 / 影响分析 / 升级规划，可上传依赖文件或源码</div>
  </div>
</div>

<script>
// ═══════════ 状态 ═══════════
let token = null;
let userId = null;
const conversations = {};   // threadId -> { id, title, messages:[], steps:[], ws, status, dir }
let activeId = null;
let pendingFiles = [];      // 待上传文件
let fileTimer = null;

const $ = s => document.querySelector(s);

// ═══════════ 登录 ═══════════
async function login(name) {
  try {
    const res = await fetch('/api/login?user_id=' + encodeURIComponent(name), { method: 'POST' });
    const d = await res.json();
    token = d.token;
    userId = name;
    $('#avatar').textContent = (name[0] || '?').toUpperCase();
    $('#uid').textContent = name;
    return true;
  } catch (e) {
    return false;
  }
}
async function reLogin() {
  const name = prompt('输入用户名（演示用，无需密码）', userId || 'demo');
  if (!name) return;
  await login(name.trim());
}
async function ensureAuth() {
  if (token) return true;
  return await login(userId || 'demo');
}

// ═══════════ 会话 / 新建 ═══════════
function uuid() {
  if (crypto.randomUUID) return crypto.randomUUID();
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
    const r = Math.random()*16|0, v = c==='x'?r:(r&0x3|0x8); return v.toString(16);
  });
}

function newChat() {
  activeId = null;
  pendingFiles = [];
  renderAttachChips();
  renderAll();
  $('#input').focus();
}

function ensureConversation(title) {
  if (activeId && conversations[activeId]) return activeId;
  const id = uuid();
  conversations[id] = { id, title: title || '新对话', messages: [], steps: [], ws: null, status: 'idle', dir: null };
  activeId = id;
  return id;
}

function switchConv(id) {
  activeId = id;
  renderAll();
}

function closeConv(id) {
  const c = conversations[id];
  if (!c) return;
  if (c.ws) { try { c.ws.close(); } catch(_){} c.ws = null; }
  if (c.status === 'running') { /* 仍在跑：尝试取消 */ fetch(`/api/task/${id}/cancel`, {method:'POST'}); }
  delete conversations[id];
  if (activeId === id) {
    const ids = Object.keys(conversations);
    activeId = ids.length ? ids[ids.length-1] : null;
  }
  renderAll();
}

// ═══════════ 发送消息 ═══════════
async function sendMessage() {
  const input = $('#input');
  const query = input.value.trim();
  if (!query) return;
  if (!await ensureAuth()) { alert('登录失败，请刷新重试'); return; }

  const id = ensureConversation(query);
  const c = conversations[id];

  // 先上传待传文件（绑定到当前会话）
  if (pendingFiles.length) {
    await uploadFiles(id);
  }

  // 记录用户消息
  c.messages.push({ role: 'user', content: query });
  // 占位助手消息
  c.messages.push({ role: 'assistant', content: '', steps: [], status: 'running', time: new Date() });
  c.status = 'running';
  c.title = query;
  input.value = '';
  autoResize(input);
  renderAll();
  scrollBottom();

  // 发任务（带 token）
  const send = async () => {
    const res = await fetch('/api/task', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
      body: JSON.stringify({ query, thread_id: id }),
    });
    if (res.status === 401) { await login(userId || 'demo'); return send(); }
    const d = await res.json();
    connectWS(id);
  };
  try { await send(); } catch (e) { markError(id, '请求失败: ' + e.message); }
}

async function uploadFiles(threadId) {
  const fd = new FormData();
  pendingFiles.forEach(f => fd.append('files', f));
  fd.append('thread_id', threadId);
  try {
    await fetch('/api/upload', { method: 'POST', body: fd });
    pendingFiles = [];
    renderAttachChips();
  } catch (e) { console.warn('上传失败', e); }
}

// ═══════════ WebSocket ═══════════
function connectWS(threadId) {
  const c = conversations[threadId];
  if (!c) return;
  if (c.ws) { try { c.ws.close(); } catch(_){} }
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  const ws = new WebSocket(`${proto}//${location.host}/ws/${threadId}`);
  c.ws = ws;
  ws.onopen = () => { updateConn(); };
  ws.onmessage = (e) => {
    let d; try { d = JSON.parse(e.data); } catch(_) { return; }
    if (d.type !== 'monitor_event') return;
    handleEvent(threadId, d);
  };
  ws.onclose = () => { if (c.status === 'running') c.status = 'done'; updateConn(); renderAll(); };
  ws.onerror = () => { updateConn(); };
}

function handleEvent(threadId, d) {
  const c = conversations[threadId];
  if (!c) return;
  const last = c.messages[c.messages.length - 1];
  if (!last || last.role !== 'assistant') return;

  switch (d.event) {
    case 'session_created':
      if (d.data && d.data.path) c.dir = d.data.path;
      addStep(c, '📁', '工作目录', d.data && d.data.path ? shortPath(d.data.path) : d.message);
      scheduleFileRefresh();
      break;
    case 'tool_start':
      addStep(c, iconForTool(d.data && d.data.tool_name), labelForTool(d.data && d.data.tool_name), fmtArgs(d.data && d.data.args));
      break;
    case 'assistant_call':
      addStep(c, '🤖', labelForAgent(d.data && d.data.assistant_name), (d.data && d.data.args && d.data.args.description) || '');
      break;
    case 'parallel_group': {
      const x = d.data || {};
      const label = x.status === 'started' ? '并行组启动' : '并行组汇合';
      const elapsed = x.duration_ms != null ? ' · ' + x.duration_ms + ' ms' : '';
      addStep(c, x.status === 'started' ? '⚡' : '🔀', label, (x.stage_ids || []).join(' + ') + elapsed);
      break;
    }
    case 'agent_status':
      upsertParallelStep(c, d.data || {});
      break;
    case 'task_result':
      last.content = (d.data && d.data.result) || d.message || '完成';
      last.status = 'done';
      c.status = 'done';
      scheduleFileRefresh();
      break;
    case 'error':
      last.content = d.message || '执行出错';
      last.status = 'error';
      c.status = 'error';
      break;
  }
  renderAll();
  scrollBottom();
}

function addStep(c, icon, label, detail) {
  const last = c.messages[c.messages.length - 1];
  if (!last || !last.steps) last.steps = [];
  last.steps.push({ icon, label, detail: detail || '' });
}

function upsertParallelStep(c, data) {
  const last = c.messages[c.messages.length - 1];
  if (!last || !last.steps) last.steps = [];
  const key = 'parallel:' + data.group_id + ':' + data.stage_id;
  let step = last.steps.find(item => item.key === key);
  const statusText = data.status === 'started' ? '并行运行中' : data.status === 'completed' ? '已完成' : '失败';
  const elapsed = data.duration_ms != null ? ' · ' + data.duration_ms + ' ms' : '';
  const detail = statusText + elapsed + (data.error ? ' · ' + data.error : '');
  if (!step) {
    step = { key, icon: data.status === 'started' ? '⚡' : '✅', label: data.stage_id + ' ' + labelForAgent(data.assistant_name), detail };
    last.steps.push(step);
  } else {
    step.icon = data.status === 'completed' ? '✅' : data.status === 'failed' ? '❌' : '⚡';
    step.detail = detail;
  }
}

function markError(id, msg) {
  const c = conversations[id];
  if (!c) return;
  const last = c.messages[c.messages.length - 1];
  if (last && last.role === 'assistant') { last.content = msg; last.status = 'error'; }
  c.status = 'error';
  renderAll();
}

// ═══════════ 渲染 ═══════════
function renderAll() { renderConvList(); renderChat(); updateConn(); }

function renderConvList() {
  const el = $('#convList');
  const ids = Object.keys(conversations);
  if (!ids.length) { el.innerHTML = '<div style="padding:12px 10px;font-size:12px;color:var(--text-faint);text-align:center;">暂无对话</div>'; return; }
  el.innerHTML = ids.map(id => {
    const c = conversations[id];
    const active = id === activeId ? ' active' : '';
    return `<div class="conv-item${active}" onclick="switchConv('${id}')">
      <span class="conv-status ${c.status}"></span>
      <span class="conv-title" title="${escapeAttr(c.title)}">${escapeHtml(c.title || '新对话')}</span>
      <span class="conv-del" onclick="event.stopPropagation();closeConv('${id}')">×</span>
    </div>`;
  }).join('');
  // 标题栏
  const c = activeId && conversations[activeId];
  $('#topbarTitle').innerHTML = c ? escapeHtml(c.title || '新对话') : '<span class="dim">新建对话</span>';
}

function renderChat() {
  const el = $('#chatInner');
  const c = activeId && conversations[activeId];
  if (!c || !c.messages.length) {
    el.innerHTML = `<div class="empty-state">
      <div class="logo-big">🛡</div>
      <h2>DepGuard Agent</h2>
      <p>开源依赖供应链风险分析平台：六个领域 Agent 协作完成依赖解析、漏洞聚合、影响分析、升级规划和报告审查。</p>
      <div class="suggestions">
        <div class="suggestion" onclick="useSuggestion('分析上传的 requirements.txt，生成漏洞清单和 SBOM')">📦 扫描依赖文件</div>
        <div class="suggestion" onclick="useSuggestion('检查 requests 是否在生产代码中被引用')">🔎 分析依赖影响</div>
        <div class="suggestion" onclick="useSuggestion('帮我查一下 requests 2.31.0 的漏洞并给出升级方案')">🛡 规划安全升级</div>
      </div>
    </div>`;
    return;
  }
  el.innerHTML = c.messages.map(m => renderMessage(m)).join('');
}

function renderMessage(m) {
  if (m.role === 'user') {
    return `<div class="msg msg-user"><div class="bubble-user">${escapeHtml(m.content)}</div></div>`;
  }
  const err = m.status === 'error' ? ' msg-error' : '';
  const stepsHtml = (m.steps && m.steps.length)
    ? `<div class="steps open">
        <div class="steps-head" onclick="this.parentElement.classList.toggle('open')">
          ${m.status === 'running' ? '<span class="spinner"></span>' : '<span>🧠</span>'}
          <span>${m.status === 'running' ? '思考中…' : '执行过程'}</span>
          <span class="chevron">▾</span>
        </div>
        <div class="steps-body">${m.steps.map(s =>
          `<div class="step"><span class="s-icon">${s.icon}</span><span class="s-label">${escapeHtml(s.label)}</span><span class="s-detail">${escapeHtml(s.detail)}</span></div>`
        ).join('')}</div>
      </div>`
    : '';
  const body = m.status === 'running'
    ? '<div class="answer" style="color:var(--text-faint);">正在等待结果…</div>'
    : (m.content ? `<div class="answer">${renderMarkdown(m.content)}</div>` : '');
  const time = m.time ? `<span class="time">${fmtTime(m.time)}</span>` : '';
  return `<div class="msg msg-assistant${err}">
    <div class="msg-avatar">🛡</div>
    <div class="msg-content">
      <div class="msg-name">MultiAgent${time}</div>
      ${stepsHtml}
      ${body}
    </div>
  </div>`;
}

// ═══════════ 文件 ═══════════
function scheduleFileRefresh() { if (fileTimer) clearTimeout(fileTimer); fileTimer = setTimeout(refreshFiles, 2500); }

async function refreshFiles() {
  const el = $('#fileList');
  try {
    // 拉取会话标题映射（thread_id → title），用于把 session_{uuid} 显示成可读标题
    const titleMap = {};
    try {
      const sr = await fetch('/api/sessions');
      const sd = await sr.json();
      (sd.sessions || []).forEach(s => { if (s.title) titleMap[s.id] = s.title; });
    } catch (_) {}

    const res = await fetch('/api/files');
    const d = await res.json();
    if (d.error || !d.files || !d.files.length) {
      el.innerHTML = '<div style="padding:14px 10px;font-size:12px;color:var(--text-faint);text-align:center;">暂无生成文件</div>';
      return;
    }
    // 按 session 分组，当前会话置顶
    const groups = {};
    d.files.forEach(f => {
      const parts = f.path.replace(/\\/g, '/').split('/');
      const i = parts.findIndex(p => p.startsWith('session_'));
      const g = i >= 0 ? parts[i] : '其他';
      (groups[g] = groups[g] || []).push(f);
    });
    const cur = activeId ? `session_${activeId}` : null;
    const sorted = Object.entries(groups).sort((a,b) => (a[0]===cur?-1:b[0]===cur?1:b[0].localeCompare(a[0])));
    el.innerHTML = sorted.map(([g, fs]) => {
      const threadId = g.replace(/^session_/, '');
      const label = titleMap[threadId] || g;  // 有标题用标题，否则回退到文件夹名
      return `<div style="font-size:10px;color:var(--text-faint);padding:8px 8px 3px;letter-spacing:.4px;">${g === cur ? '▸ ' : ''}${escapeHtml(label)}</div>` +
        fs.map(f => `<div class="file-item">
          <span class="file-icon">${iconForFile(f.name)}</span>
          <div style="flex:1;min-width:0;">
            <div class="file-name" title="${escapeAttr(f.name)}">${escapeHtml(f.name)}</div>
            <div class="file-meta">${fmtSize(f.size)}</div>
          </div>
          <span class="file-dl" onclick="downloadFile('${encodeURIComponent(f.path)}')" title="下载">⬇</span>
        </div>`).join('');
    }).join('');
  } catch (_) {}
}

// ═══════════ 工具函数 ═══════════
function useSuggestion(t) { $('#input').value = t; autoResize($('#input')); $('#input').focus(); }

function onFilesSelected(files) {
  for (const f of files) pendingFiles.push(f);
  renderAttachChips();
}
function renderAttachChips() {
  const el = $('#attachChips');
  el.innerHTML = pendingFiles.map((f, i) =>
    `<span class="attach-chip">📎 ${escapeHtml(f.name)} <span class="rm" onclick="removeFile(${i})">✕</span></span>`
  ).join('');
}
function removeFile(i) { pendingFiles.splice(i, 1); renderAttachChips(); }

function toggleSidebar() { $('#sidebar').classList.toggle('collapsed'); }

function updateConn() {
  const ids = Object.keys(conversations);
  const anyOpen = ids.some(id => conversations[id].ws && conversations[id].ws.readyState === WebSocket.OPEN);
  const running = ids.some(id => conversations[id].status === 'running');
  $('#connDot').className = 'conn-dot' + (anyOpen ? ' on' : (ids.length ? '' : ''));
  $('#connText').textContent = running ? '运行中' : (anyOpen ? '已连接' : '就绪');
}

function scrollBottom() {
  const s = $('#chatScroll');
  s.scrollTop = s.scrollHeight;
}

// ── 标签映射 ──
function iconForTool(name) {
  const n = (name || '').toLowerCase();
  if (n.includes('网络') || n.includes('search') || n.includes('tavily')) return '🌐';
  if (n.includes('sql') || n.includes('表') || n.includes('数据库') || n.includes('db')) return '🗄️';
  if (n.includes('rag') || n.includes('知识') || n.includes('助手列表')) return '📚';
  if (n.includes('markdown') || n.includes('md')) return '📝';
  if (n.includes('pdf')) return '📄';
  if (n.includes('osv') || n.includes('漏洞')) return '🛡';
  if (n.includes('sbom')) return '📦';
  if (n.includes('读取') || n.includes('read')) return '📂';
  return '🔧';
}
function labelForTool(name) {
  const n = (name || '');
  return n.replace(/工具$/, '').replace(/：.*$/, '');
}
function labelForAgent(name) {
  const n = (name || '');
  if (n.includes('依赖解析')) return '依赖解析助手';
  if (n.includes('漏洞情报')) return '漏洞情报助手';
  if (n.includes('许可证') || n.includes('维护性')) return '许可证与维护性助手';
  if (n.includes('影响分析')) return '影响分析助手';
  if (n.includes('升级规划')) return '升级规划助手';
  if (n.includes('报告') || n.includes('审查')) return '报告与审查助手';
  return n || '子智能体';
}
function fmtArgs(args) {
  if (!args) return '';
  try { const s = JSON.stringify(args); return s.length > 60 ? s.slice(0, 60) + '…' : s; }
  catch(_) { return ''; }
}
function shortPath(p) { const parts = String(p).replace(/\\/g,'/').split('/'); return parts.slice(-2).join('/'); }
function iconForFile(n) {
  if (n.endsWith('.md')) return '📝';
  if (n.endsWith('.pdf')) return '📄';
  if (n.endsWith('.json')) return '📦';
  if (n.endsWith('.txt')) return '📃';
  return '📎';
}
function downloadFile(p) { window.open(`/api/download?path=${encodeURIComponent(p)}`, '_blank'); }
function fmtTime(t) { try { return new Date(t).toLocaleTimeString('zh-CN', {hour12:false}); } catch(_) { return ''; } }
function fmtSize(b) {
  if (!b) return '0 B';
  const u = ['B','KB','MB','GB']; let i = 0;
  while (b >= 1024 && i < 3) { b /= 1024; i++; }
  return b.toFixed(i > 0 ? 1 : 0) + ' ' + u[i];
}
function escapeHtml(s) { if (!s) return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function escapeAttr(s) { return escapeHtml(s); }

// ── 极简 Markdown 渲染 ──
function renderMarkdown(src) {
  if (!src) return '';
  const codeBlocks = [];
  let text = String(src).replace(/```([\s\S]*?)```/g, (_, code) => {
    codeBlocks.push(code.replace(/^\w*\n/, ''));
    return '\u0000C' + (codeBlocks.length - 1) + '\u0000';
  });
  // 先转义 HTML，防止注入，同时把 > < & 转成实体
  text = escapeHtml(text);
  // 表格
  text = text.replace(/(?:^\|.+\|\s*$\n?)+/gm, block => renderTable(block));
  // 行内代码
  text = text.replace(/`([^`]+)`/g, '<code>$1</code>');
  // 标题
  text = text.replace(/^###### (.*)$/gm, '<h4>$1</h4>');
  text = text.replace(/^##### (.*)$/gm, '<h4>$1</h4>');
  text = text.replace(/^#### (.*)$/gm, '<h4>$1</h4>');
  text = text.replace(/^### (.*)$/gm, '<h3>$1</h3>');
  text = text.replace(/^## (.*)$/gm, '<h2>$1</h2>');
  text = text.replace(/^# (.*)$/gm, '<h1>$1</h1>');
  // 粗体/斜体
  text = text.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  text = text.replace(/\*(.+?)\*/g, '<em>$1</em>');
  // 链接
  text = text.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  // 引用（转义后 > 变成 &gt;）
  text = text.replace(/^&gt; (.*)$/gm, '<blockquote>$1</blockquote>');
  // 列表
  text = text.replace(/^[-*] (.*)$/gm, '<li>$1</li>');
  text = text.replace(/^\d+\. (.*)$/gm, '<li>$1</li>');
  // 把连续的 li 合并成一个 ul
  text = text.replace(/(?:<li>.*<\/li>\n?)+/g, m => '<ul>' + m.trim() + '</ul>');
  // 分隔线
  text = text.replace(/^---+$/gm, '<hr>');
  // 段落：空行分隔
  text = text.split(/\n{2,}/).map(seg => {
    seg = seg.trim();
    if (!seg) return '';
    if (/^<(h1|h2|h3|h4|ul|ol|blockquote|hr|pre|table)/.test(seg)) return seg;
    return '<p>' + seg.replace(/\n/g, '<br>') + '</p>';
  }).join('');
  // 还原代码块
  text = text.replace(/\u0000C(\d+)\u0000/g, (_, i) => '<pre><code>' + escapeHtml(codeBlocks[+i]) + '</code></pre>');
  return text;
}
function renderTable(block) {
  const lines = block.trim().split('\n').map(l => l.trim()).filter(l => l.includes('|'));
  if (lines.length < 2) return escapeHtml(block);
  const parse = l => l.replace(/^\|/, '').replace(/\|$/, '').split('|').map(c => c.trim());
  const header = parse(lines[0]);
  let bodyStart = 1;
  if (lines[1] && /^[\s|:-]+$/.test(lines[1])) bodyStart = 2;  // 跳过分隔行
  let html = '<table><thead><tr>' + header.map(h => `<th>${escapeHtml(h)}</th>`).join('') + '</tr></thead><tbody>';
  for (let i = bodyStart; i < lines.length; i++) {
    html += '<tr>' + parse(lines[i]).map(c => `<td>${escapeHtml(c)}</td>`).join('') + '</tr>';
  }
  return html + '</tbody></table>';
}

// ── 输入框自适应 ──
function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 180) + 'px';
}
$('#input').addEventListener('input', e => autoResize(e.target));
$('#input').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});

// ═══════════ 初始化 ═══════════
(async function init() {
  await login('demo');
  renderAll();
  refreshFiles();                      // 页面加载时拉取一次文件列表
  setInterval(updateConn, 3000);       // 定期刷新连接状态（本地检查，无网络请求）
})();
</script>
